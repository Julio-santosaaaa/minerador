name: teste-rapido

# Teste de 1 minuto, SEM minerar: confere Notion (cria as colunas de nota) e Groq.
# Só dispara na mão: Actions -> teste-rapido -> Run workflow.
on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m minerador selftest
